[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "volteyr-agentic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.28",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "duckdb>=0.9",
    "pydantic>=2.0",
    "requests>=2.31",
]
